# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 密码认证（原配置无密码，保持一致）
# requirepass redis2024

# 持久化
save 900 1
save 300 10
save 60 10000

# RDB文件
dbfilename dump.rdb
dir /data

# AOF持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice
logfile ""

# 其他配置
timeout 0
tcp-keepalive 300
daemonize no
supervised no
