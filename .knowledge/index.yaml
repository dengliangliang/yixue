# 1213易学算命小程序 - 知识库索引

project:
  name: "1213易学算命小程序"
  description: "基于易学命理的在线测算服务平台"
  version: "1.0.0"
  created: "2025-01-19"

# 技术栈
tech_stack:
  backend:
    framework: "ThinkPHP 5.1"
    admin: "FastAdmin"
    language: "PHP 7.4+"
    database: "MySQL 5.7"
  
  frontend:
    framework: "uni-app"
    ui: "uview-ui"
    language: "Vue 2"
    platform: "微信小程序"
  
  libraries:
    - name: "lunar-php"
      version: "1.3+"
      purpose: "农历日期转换和八字计算"
    - name: "EasyWeChat"
      version: "4.6+"
      purpose: "微信API集成"

# 功能模块
features:
  - id: "F001"
    name: "用户管理"
    path: "features/user-management"
    status: "已实现"
    priority: "高"
  
  - id: "F002"
    name: "四柱八字计算"
    path: "features/sizhu-calculation"
    status: "已实现"
    priority: "核心"
  
  - id: "F003"
    name: "起运计算"
    path: "features/qiyun-calculation"
    status: "已实现"
    priority: "核心"
  
  - id: "F004"
    name: "五行分析"
    path: "features/wuxing-analysis"
    status: "已实现"
    priority: "核心"
  
  - id: "F005"
    name: "测算记录管理"
    path: "features/record-management"
    status: "已实现"
    priority: "中"

# 架构决策记录
architecture_decisions:
  - id: "ADR-001"
    title: "使用lunar-php进行农历计算"
    path: "adr/001-lunar-php-library.md"
    status: "已采纳"
  
  - id: "ADR-002"
    title: "数据库参数化查询规范"
    path: "adr/002-database-param-binding.md"
    status: "已采纳"
  
  - id: "ADR-003"
    title: "小程序样式选择器限制"
    path: "adr/003-miniprogram-css-constraints.md"
    status: "已采纳"

# 数据库设计
database:
  tables:
    core:
      - "fa_user - 用户表"
      - "fa_record - 测算记录表"
      - "fa_record_shen - 十神记录表"
    
    reference:
      - "fa_tian_gan - 天干表"
      - "fa_month_zhi - 地支表"
      - "fa_si_zhu_shi_shen - 四柱十神关系表"
      - "fa_tian_gan_zhi - 天干地支组合表"
      - "fa_year_ju_ben - 年柱剧本表"
      - "fa_wang_yun - 旺运表"
    
    system:
      - "fa_admin - 管理员表"
      - "fa_area - 地区表"
      - "fa_config - 配置表"

# 关键业务流程
workflows:
  - name: "用户测算流程"
    steps:
      - "用户输入出生信息（阳历日期、时辰、性别、地区）"
      - "系统转换为农历日期"
      - "计算真太阳时修正"
      - "生成四柱八字"
      - "计算十神关系"
      - "分析五行强弱"
      - "计算起运时间"
      - "生成测算结果"
  
  - name: "数据持久化流程"
    steps:
      - "创建测算记录"
      - "保存四柱信息到record_shen表"
      - "关联用户ID"
      - "返回记录ID"

# API端点
api_endpoints:
  user:
    - "POST /api/user/addRecord - 添加测算记录"
    - "GET /api/user/getProvinceList - 获取省份列表"
    - "GET /api/user/getCityList - 获取城市列表"
  
  sizhu:
    - "GET /api/sizhu/getSiZhuRes - 获取四柱结果"
    - "GET /api/sizhu/getQiYun - 获取起运信息"
    - "GET /api/sizhu/getResult - 获取完整测算结果"

# 环境配置
environments:
  development:
    os: "Windows"
    location: "本地"
    database_host: "47.104.249.160"
  
  production:
    os: "Linux"
    location: "远程服务器"
    server_ip: "47.104.249.160"

