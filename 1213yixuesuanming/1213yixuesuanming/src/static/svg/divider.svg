<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 20" preserveAspectRatio="none">
  <defs>
    <linearGradient id="dividerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#D4AF37;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#D4AF37;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- 中心装饰 -->
  <circle cx="375" cy="10" r="4" fill="#D4AF37"/>
  <circle cx="355" cy="10" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="395" cy="10" r="2" fill="#D4AF37" opacity="0.6"/>
  <!-- 两侧线条 -->
  <line x1="50" y1="10" x2="340" y2="10" stroke="url(#dividerGold)" stroke-width="1"/>
  <line x1="410" y1="10" x2="700" y2="10" stroke="url(#dividerGold)" stroke-width="1"/>
</svg>
