<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 弹窗提示</title>
    <!-- 引入库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #1a1a2e;
        }

        .content {
            width: 100%;
            height: 100%;
            background-image: url('static/shouye3.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center center;
            background-color: #F5E6D3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 遮罩层 */
        .mask {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* 弹窗容器 */
        .popup-container {
            width: 85%;
            max-width: 400px;
            background: linear-gradient(180deg, #FFF8E7 0%, #F5E6C8 100%);
            border: 3px solid #DAA520;
            border-radius: 20px;
            padding: 30px 20px;
            /* 提高层级 */
            z-index: 20;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .popup-title {
            font-size: 22px;
            color: #333;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .popup-text {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: justify;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            flex: 1;
            height: 45px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
        }

        .btn-list {
            background-color: #fff;
            color: #b22222;
            border-color: #f5c2c2;
        }

        .btn-share {
            background: linear-gradient(135deg, #D0000F 0%, #8B0000 100%);
            color: #fff;
            border: none;
            box-shadow: 0 4px 10px rgba(208, 0, 15, 0.2);
        }

        /* 装饰元素 */
        .decor-horse {
            position: absolute;
            width: 140px;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.75;
            z-index: 1;
        }

        /* 主题文案容器 */
        .theme-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 30px;
            position: absolute;
            top: 10%;
            /* 降低层级 */
            z-index: 5;
        }

        /* 主题文案图片样式 */
        .theme-image {
            max-width: 90%;
            height: auto;
            transform: scaleY(1.4) scaleX(1.1);
        }
    </style>
</head>

<body>
    <div class="content">
        <div class="mask"></div>

        <!-- 主题文案 - 解密2026 -->
        <div class="theme-container animate__animated animate__fadeInDown">
            <img src="static/jiemi.png" class="theme-image" alt="解密2026">
        </div>

        <!-- 弹窗 -->
        <div class="popup-container animate__animated animate__zoomIn">
            <div class="popup-title">亲爱的朋友</div>
            <div class="popup-text">
                乙巳将终，丙午在即，中信保诚人寿推出《解密2026，探索美好未来》，解锁更多2026人生线索。事业如何，贵人在哪，健康密钥，解密未来，诚邀参加！
            </div>
            <div class="btn-group">
                <div class="btn btn-list" onclick="location.href='list.html'">客户清单</div>
                <div class="btn btn-share" onclick="alert('分享成功')">分享活动</div>
            </div>
        </div>

        <!-- 装饰 -->
        <img src="static/ma3.png" class="decor-horse animate__animated animate__fadeInUp" alt="">
    </div>
</body>

</html>
