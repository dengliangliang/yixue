server {
    listen 80;
    server_name _;
    root /var/www/yixue/public;
    index index.php index.html index.htm;

    # 日志
    access_log /var/log/nginx/yixue_access.log;
    error_log /var/log/nginx/yixue_error.log;

    # 隐藏Nginx版本
    server_tokens off;

    # 静态文件缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件目录
    location /uploads {
        alias /var/www/yixue/public/uploads;
        autoindex off;
    }

    # PHP处理
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass yixue-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # 超时设置
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        
        # 🔥 禁止CDN缓存API响应
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Cache-Status "BYPASS" always;
    }

    # 管理后台路由 - 使用admin.php入口
    location /admin {
        # 将 /admin 或 /admin/xxx 重写为 /admin.php?s=/xxx (去掉/admin前缀)
        rewrite ^/admin$ /admin.php last;
        rewrite ^/admin/(.*)$ /admin.php?s=$1&$query_string last;
    }

    # ThinkPHP路由 - 使用s参数传递PATH_INFO
    location / {
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 禁止访问敏感文件
    location ~ \.(env|git|svn|htaccess)$ {
        deny all;
    }
}

# HTTPS配置
server {
    listen 443 ssl http2;
    server_name _;
    root /var/www/yixue/public;
    index index.php index.html index.htm;

    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 日志
    access_log /var/log/nginx/yixue_access.log;
