# 后端API HTTPS - yixueAdmin.linqingkeji.com
server {
    listen 443 ssl http2;
    server_name yixueAdmin.linqingkeji.com;

    # 使用Cloudflare Origin证书或通配符证书
    ssl_certificate /home/wwwroot/default/ssl/yixueadmin.pem;
    ssl_certificate_key /home/wwwroot/default/ssl/certificate.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5";
    ssl_session_cache shared:SSL:10m;

    access_log /home/wwwlogs/yixueAdmin.linqingkeji.com.ssl.log;
    error_log /home/wwwlogs/yixueAdmin.linqingkeji.com.ssl.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
