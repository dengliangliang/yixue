# 后端API HTTPS - yixueAdmin.linqingkeji.com
server {
    listen 443 ssl http2;
    server_name yixueAdmin.linqingkeji.com;

    # SSL 证书配置
    ssl_certificate /home/wwwroot/default/ssl/yixueadmin.pem;
    ssl_certificate_key /home/wwwroot/default/ssl/certificate.key;
    
    # SSL 性能优化
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets on;
    
    # SSL 协议和密码套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    
    # OCSP Stapling - 减少SSL握手延迟
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 114.114.114.114 valid=300s;
    resolver_timeout 5s;

    access_log /home/wwwlogs/yixueAdmin.linqingkeji.com.ssl.log;
    error_log /home/wwwlogs/yixueAdmin.linqingkeji.com.ssl.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
