<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" preserveAspectRatio="none">
  <defs>
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D0000F"/>
      <stop offset="50%" style="stop-color:#A22823"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- 按钮背景 -->
  <rect x="4" y="4" width="292" height="72" rx="36" ry="36" 
        fill="url(#btnGradient)" filter="url(#btnShadow)"/>
  <!-- 高光效果 -->
  <ellipse cx="150" cy="20" rx="100" ry="10" fill="rgba(255,255,255,0.15)"/>
</svg>
